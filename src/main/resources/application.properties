spring.application.name=validador-fotos
server.port=${SERVER_PORT:8000}

spring.config.import=optional:file:.env[.properties]
# Contrato HTTP em snake_case (usuario_id, categoria_informada...), como o app já consome
spring.jackson.property-naming-strategy=SNAKE_CASE

# DataSource (PostgreSQL do app)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Swagger
springdoc.swagger-ui.path=/docs

# Health e métricas (o /saude e o /metrics são rotas do próprio serviço)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Validador de fotos
app.validador.chave-api=${CHAVE_API}
app.validador.chave-api-anterior=${CHAVE_API_ANTERIOR:}
app.validador.hosts-permitidos=${HOSTS_PERMITIDOS}
app.validador.limiar-confianca=${LIMIAR_CONFIANCA:0.5}
app.validador.limiar-revisao=${LIMIAR_REVISAO:}
app.validador.limiares-por-categoria=${LIMIARES_POR_CATEGORIA:}
app.validador.max-pedidos-simultaneos=${MAX_PEDIDOS_SIMULTANEOS:8}
app.validador.tamanho-maximo-bytes=${TAMANHO_MAXIMO_BYTES:10000000}
app.validador.timeout-download-segundos=${TIMEOUT_DOWNLOAD_SEGUNDOS:10}
app.validador.clip-dir=${CLIP_DIR:modelos/clip-vit-base-patch32}
app.validador.cabeca-treinada=${CABECA_TREINADA:}

# Segunda opinião (opcional, custa uma chamada paga por foto na zona de revisão)
app.validador.segunda-opiniao.ativa=${SEGUNDA_OPINIAO_ATIVA:false}
app.validador.segunda-opiniao.url-base=${SEGUNDA_OPINIAO_URL_BASE:https://api.openai.com/v1}
app.validador.segunda-opiniao.chave=${SEGUNDA_OPINIAO_CHAVE:}
app.validador.segunda-opiniao.modelo=${SEGUNDA_OPINIAO_MODELO:gpt-4o-mini}
app.validador.segunda-opiniao.timeout-segundos=${SEGUNDA_OPINIAO_TIMEOUT_SEGUNDOS:15}

# Fechamento das janelas de validação de 24h (job dentro da API)
app.validation.fechamento-habilitado=${FECHAMENTO_HABILITADO:true}
app.validation.batch-size=100
app.validation.delay-ms=60000
